name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored in this repository.
#
# One-time setup on PyPI:
#   Your projects -> Publishing -> Add a new pending publisher
#   PyPI project name: hix-cli
#   Owner: hix-pro
#   Repository: hix
#   Workflow name: publish.yml
#   Environment name: pypi
#
# Then set the repository variable PYPI_PUBLISH=true and publish a GitHub
# release. The workflow builds the sdist and wheel, checks them with Twine,
# and uploads them with the `pypi` environment.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Publishing stays off until the repository variable PYPI_PUBLISH is set to
    # true (Settings -> Secrets and variables -> Actions -> Variables). The
    # build job still verifies every release package.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hix-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
